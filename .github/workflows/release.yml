name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Verify release tag matches DLL version
      shell: pwsh
      run: |
        $header = Get-Content src/globals.h -Raw
        $parts = foreach ($part in 'MAJOR', 'MINOR', 'PATCH') {
          $match = [regex]::Match($header, "(?m)^#define EIEM_VERSION_$part\s+(\d+)\s*$")
          if (-not $match.Success) { throw "Missing EIEM_VERSION_$part" }
          $match.Groups[1].Value
        }
        $version = 'v' + ($parts -join '.')
        git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
        if ($LASTEXITCODE -ne 0) { throw "Missing tag $env:RELEASE_TAG" }
        if ($version -ne $env:RELEASE_TAG) {
          throw "Tag $env:RELEASE_TAG does not match DLL $version"
        }

    - name: Build Project
      run: |
        cmd /c build.bat

    - name: Package Release
      shell: pwsh
      run: |
        $tag = $env:RELEASE_TAG
        $releaseRoot = "release_pkg"
        $gameRoot = Join-Path $releaseRoot "game"
        $pluginRoot = Join-Path $gameRoot "plugin"
        New-Item -ItemType Directory -Force -Path $pluginRoot | Out-Null

        Copy-Item bin\d3dcompiler_47.dll, bin\vulkan-1.dll, LICENSE, THIRD_PARTY_NOTICES, bin\LUA-LICENSE.txt -Destination $gameRoot
        Copy-Item bin\eiem.dll, bin\eiem.ini -Destination $pluginRoot
        Compress-Archive -Path "$gameRoot\*" -DestinationPath "EIEM_${tag}_dll.zip" -Force

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        files: |
          EIEM_${{ env.RELEASE_TAG }}_dll.zip
        body_path: RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
