name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string
      native_base_run_id:
        description: Optional workflow run ID containing the validated Blender native base
        required: false
        type: string
        default: ''
      native_base_artifact_tag:
        description: Release tag used in the validated native base artifact name
        required: false
        type: string
        default: ''
      native_base_sha256:
        description: Required SHA256 when reusing a Blender native base artifact
        required: false
        type: string
        default: ''

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  NATIVE_BASE_RUN_ID: ${{ inputs.native_base_run_id || '' }}
  NATIVE_BASE_ARTIFACT_TAG: ${{ inputs.native_base_artifact_tag || inputs.tag || github.ref_name }}
  NATIVE_BASE_SHA256: ${{ inputs.native_base_sha256 || '' }}

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}
        submodules: recursive

    - name: Verify release tag matches DLL version
      shell: pwsh
      run: |
        $header = Get-Content src/eiem_version.h -Raw
        $parts = foreach ($part in 'MAJOR', 'MINOR', 'PATCH') {
          $match = [regex]::Match($header, "(?m)^#define EIEM_VERSION_$part\s+(\d+)\s*$")
          if (-not $match.Success) { throw "Missing EIEM_VERSION_$part" }
          $match.Groups[1].Value
        }
        $version = 'v' + ($parts -join '.')
        git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
        if ($LASTEXITCODE -ne 0) { throw "Missing tag $env:RELEASE_TAG" }
        if ($version -ne $env:RELEASE_TAG) {
          throw "Tag $env:RELEASE_TAG does not match DLL $version"
        }

    - name: Build Project
      run: |
        cmd /c build.bat v35

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Verify updated-game model pool binding
      shell: pwsh
      run: |
        cmd /c tools\diagnostics\build_model_pool_discard_smoke.cmd
        if ($LASTEXITCODE -ne 0) { throw 'Model pool adapter test build failed' }
        & bin/model-pool-discard/smoke.exe
        if ($LASTEXITCODE -ne 0) { throw 'Model pool adapter test failed' }

    - name: Verify public index and source package contracts
      shell: pwsh
      run: |
        dotnet run --project tools/AnimeStudio/AnimeStudio.IndexTests/AnimeStudio.IndexTests.csproj -c Release -p:TargetFrameworks=net9.0-windows
        if ($LASTEXITCODE -ne 0) { throw 'Public index and BLC regression failed' }
        dotnet run --project tools/AnimeStudio/AnimeStudio.UpdateTests/AnimeStudio.UpdateTests.csproj -c Release -p:TargetFrameworks=net9.0-windows
        if ($LASTEXITCODE -ne 0) { throw 'Source update regression failed' }

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify release preflight tooling
      shell: pwsh
      run: |
        python -m unittest discover -s tools/release -v
        if ($LASTEXITCODE -ne 0) { throw 'Release preflight regression failed' }

    - name: Download prepared Blender native base
      if: env.NATIVE_BASE_RUN_ID != ''
      uses: actions/download-artifact@v4
      with:
        name: eff-blender-native-base-${{ env.NATIVE_BASE_ARTIFACT_TAG }}
        path: bin/release-artifacts
        repository: ${{ github.repository }}
        run-id: ${{ env.NATIVE_BASE_RUN_ID }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download pinned Blender native base
      if: env.NATIVE_BASE_RUN_ID == ''
      shell: pwsh
      run: |
        $manifest = Get-Content tools/Blender/native-base.json -Raw | ConvertFrom-Json
        $uri = [Uri]$manifest.url
        $parts = $uri.AbsolutePath.Trim('/').Split('/')
        if ($uri.Scheme -ne 'https' -or $uri.Host -ne 'github.com' -or $parts.Count -lt 5 -or $parts[0] -ne 'ssice-a' -or $parts[1] -ne 'EFF' -or $parts[2] -ne 'releases' -or $parts[3] -ne 'download') {
          throw 'native-base.json must point to an immutable EFF release asset on github.com'
        }
        if ($parts[4] -eq $env:RELEASE_TAG) {
          throw 'This release creates its own native base. Run Prepare Blender Native Base first, pin its receipt, then pass that workflow run ID and SHA256.'
        }
        New-Item -ItemType Directory -Force bin/release-artifacts | Out-Null
        $archive = Join-Path 'bin/release-artifacts' (Split-Path $uri.AbsolutePath -Leaf)
        try {
          Invoke-WebRequest -Uri $manifest.url -OutFile $archive
        } catch {
          throw "Pinned Blender native base is unavailable at $($manifest.url): $($_.Exception.Message)"
        }
        Write-Host "DOWNLOADED_NATIVE_BASE file=$archive bytes=$((Get-Item $archive).Length)"

    - name: Verify Blender native base against manifest and DLL protocol
      if: env.NATIVE_BASE_RUN_ID != ''
      shell: pwsh
      run: |
        if ($env:NATIVE_BASE_RUN_ID -notmatch '^\d+$') { throw 'Invalid Blender native base workflow run ID' }
        if ($env:NATIVE_BASE_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'A valid native base SHA256 is required when reusing an artifact' }
        $archives = @(Get-ChildItem bin/release-artifacts -Filter 'EFF_Blender_Native_*.zip' -File -ErrorAction SilentlyContinue)
        if ($archives.Count -ne 1) { throw "Expected one Blender native base ZIP; found $($archives.Count)" }
        $expected = Get-Content tools/Blender/native-base.json -Raw | ConvertFrom-Json
        $actual = Get-FileHash $archives[0].FullName -Algorithm SHA256
        if ($actual.Hash -ine $env:NATIVE_BASE_SHA256) { throw 'Prepared native base SHA256 differs from the requested digest' }
        if ($archives[0].Length -ne $expected.bytes -or $actual.Hash -ine $expected.sha256) { throw 'Prepared native base differs from the committed native-base.json receipt' }
        python tools/release/verify_native_base.py --archive $archives[0].FullName --dll-protocol bin/resource-directory-entry-v35/package-protocol.json --manifest tools/Blender/native-base.json --sha256 $env:NATIVE_BASE_SHA256
        if ($LASTEXITCODE -ne 0) { throw 'Prepared Blender native base is incompatible with the production DLL protocol' }

    - name: Verify downloaded Blender native base against manifest and DLL protocol
      if: env.NATIVE_BASE_RUN_ID == ''
      shell: pwsh
      run: |
        $archives = @(Get-ChildItem bin/release-artifacts -Filter 'EFF_Blender_Native_*.zip' -File -ErrorAction SilentlyContinue)
        if ($archives.Count -ne 1) { throw "Expected one pinned Blender native base ZIP; found $($archives.Count)" }
        python tools/release/verify_native_base.py --archive $archives[0].FullName --dll-protocol bin/resource-directory-entry-v35/package-protocol.json --manifest tools/Blender/native-base.json
        if ($LASTEXITCODE -ne 0) { throw 'Pinned Blender native base is incompatible with the production DLL protocol' }

    - name: Upload Blender native base diagnostic
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: eff-blender-native-base-${{ env.RELEASE_TAG }}
        path: bin/release-artifacts/EFF_Blender_Native_*.zip
        if-no-files-found: warn
        retention-days: 30

    - name: Verify production DLL excludes temporary diagnostics
      shell: pwsh
      run: |
        python tools/diagnostics/verify_production_dll.py bin/resource-directory-entry-v35/eff.dll
        if ($LASTEXITCODE -ne 0) { throw 'Production diagnostic isolation failed' }

    - name: Verify native reload transaction
      shell: pwsh
      run: |
        cmd /c tools\diagnostics\build_full_resource_reload_smoke.cmd v35
        if ($LASTEXITCODE -ne 0) { throw 'Reload test build failed' }
        & "bin/resource-directory-entry-v35/full_resource_reload_smoke.exe"
        if ($LASTEXITCODE -ne 0) { throw 'Reload test failed' }

    - name: Load the actual production DLL in an isolated host
      shell: pwsh
      run: |
        cmd /c tools\diagnostics\build_production_dll_load_smoke.cmd
        if ($LASTEXITCODE -ne 0) { throw 'Production DLL host test build failed' }
        $binary = (Resolve-Path bin/resource-directory-entry-v35/eff.dll).Path
        & bin/production-dll-load/production_dll_load_smoke.exe $binary "$env:WINDIR/System32"
        if ($LASTEXITCODE -ne 0) { throw 'Production DLL attach/logging/control locks failed' }

    - name: Verify independent Mod rule composition
      shell: pwsh
      run: |
        cmd /c tools\diagnostics\build_compiled_mod_set_smoke.cmd
        if ($LASTEXITCODE -ne 0) { throw 'Compiled Mod test build failed' }
        & bin/compiled-mod-set/compiled_mod_set_smoke.exe
        if ($LASTEXITCODE -ne 0) { throw 'Compiled Mod test failed' }

    - name: Verify game UI page binding
      shell: pwsh
      run: |
        cmd /c tools\diagnostics\build_ui_page_bind_smoke.cmd
        if ($LASTEXITCODE -ne 0) { throw 'UI page binding test failed' }

    - name: Verify control panel and persisted key routing
      shell: pwsh
      run: |
        # Existing tags used E:/ for the isolated persistence fixture. Supply
        # that scratch drive without changing the tagged source or binaries.
        $fixtureDrive = $false
        $needsDrive = Select-String -Path tools/diagnostics/control_panel_smoke.cpp -SimpleMatch 'std::filesystem::path("E:/")' -Quiet
        if ($needsDrive -and -not (Test-Path 'E:\')) {
          subst E: $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Test scratch drive setup failed' }
          $fixtureDrive = $true
        }
        try {
          cmd /c tools\diagnostics\build_control_panel_smoke.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Control panel test build failed' }
          & bin/resource-directory-entry/control_panel_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'Control panel test failed' }
        } finally {
          if ($fixtureDrive) { subst E: /d }
        }

    - name: Verify static Mesh consumers and assembly
      shell: pwsh
      run: |
        cmd /c tools\diagnostics\build_static_mesh_assembly_smoke.cmd
        if ($LASTEXITCODE -ne 0) { throw 'Static Mesh test build failed' }
        & bin/static-mesh-assembly/static_mesh_assembly_smoke.exe
        if ($LASTEXITCODE -ne 0) { throw 'Static Mesh test failed' }

    - name: Package Release
      shell: pwsh
      run: |
        $tag = $env:RELEASE_TAG
        $releaseRoot = "release_pkg_v35"
        $gameRoot = Join-Path $releaseRoot "game"
        $pluginRoot = Join-Path $gameRoot "plugin"
        New-Item -ItemType Directory -Force -Path $pluginRoot | Out-Null
        # Keep the install target present so a fresh install has plugin\mods
        # ready for the user's Mods. The archive check below prevents a
        # packaging change from silently dropping this empty directory.
        $modsRoot = Join-Path $pluginRoot "mods"
        New-Item -ItemType Directory -Force -Path $modsRoot | Out-Null

        # Install the runtime DLL and both game-root proxy loaders. Symbols and
        # diagnostic/build artifacts stay out of the distribution archive.
        $buildRoot = "bin/resource-directory-entry-v35"
        Copy-Item "$buildRoot/eff.dll", "$buildRoot/eff.ini", "$buildRoot/package-protocol.json" -Destination $pluginRoot
        Copy-Item "$buildRoot/d3dcompiler_47.dll", "$buildRoot/vulkan-1.dll" -Destination $gameRoot
        Copy-Item LICENSE,THIRD_PARTY_NOTICES -Destination $pluginRoot
        $archivePath = "EFF_${tag}_dll.zip"
        Compress-Archive -Path "$gameRoot\*" -DestinationPath $archivePath -Force
        Add-Type -AssemblyName System.IO.Compression
        $archivePathFull = Join-Path (Get-Location) $archivePath
        $archive = [System.IO.Compression.ZipFile]::Open(
          $archivePathFull,
          [System.IO.Compression.ZipArchiveMode]::Update)
        try {
          $archiveNames = @($archive.Entries | ForEach-Object {
            $_.FullName.Replace('\', '/')
          })
          if (-not ($archiveNames -contains "plugin/mods/")) {
            [void]$archive.CreateEntry("plugin/mods/")
          }
        } finally {
          $archive.Dispose()
        }
        $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePathFull)
        try {
          $archiveNames = @($archive.Entries | ForEach-Object {
            $_.FullName.Replace('\', '/')
          })
          if (-not ($archiveNames -contains "plugin/mods/")) {
            throw "Release archive is missing the empty plugin/mods directory"
          }
          $expectedFiles = @(
            'plugin/eff.dll', 'plugin/eff.ini', 'plugin/package-protocol.json',
            'd3dcompiler_47.dll', 'vulkan-1.dll',
            'plugin/LICENSE', 'plugin/THIRD_PARTY_NOTICES'
          )
          $actualFiles = @($archiveNames | Where-Object { -not $_.EndsWith('/') })
          if (@(Compare-Object $expectedFiles $actualFiles).Count -ne 0) {
            throw 'Release archive must contain one runtime DLL variant and only its install files'
          }
        } finally {
          $archive.Dispose()
        }

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        draft: true
        files: |
          EFF_${{ env.RELEASE_TAG }}_dll.zip
          bin/release-artifacts/EFF_Blender_Native_*.zip
        body_path: RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
