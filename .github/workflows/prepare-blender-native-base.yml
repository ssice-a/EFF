name: Prepare Blender Native Base

on:
  workflow_dispatch:
    inputs:
      framework_ref:
        description: EFF commit that will be released with this native base
        required: true
        type: string
      framework_tag:
        description: Planned EFF release tag
        required: true
        type: string
      blender_ref:
        description: Exact EFF-blender commit to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Build and receipt one native base
    runs-on: windows-latest
    steps:
      - name: Check out EFF source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.framework_ref }}
          submodules: false

      - name: Check out exact Blender source
        uses: actions/checkout@v4
        with:
          repository: ssice-a/EFF-blender
          ref: ${{ inputs.blender_ref }}
          path: tools/Blender

      - name: Verify requested EFF release version
        shell: pwsh
        env:
          FRAMEWORK_TAG: ${{ inputs.framework_tag }}
        run: |
          if ($env:FRAMEWORK_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a semantic EFF tag such as v1.11.0' }
          $header = Get-Content src/eiem_version.h -Raw
          $parts = foreach ($part in 'MAJOR', 'MINOR', 'PATCH') {
            $match = [regex]::Match($header, "(?m)^#define EIEM_VERSION_$part\s+(\d+)\s*$")
            if (-not $match.Success) { throw "Missing EIEM_VERSION_$part" }
            $match.Groups[1].Value
          }
          $version = 'v' + ($parts -join '.')
          if ($version -ne $env:FRAMEWORK_TAG) { throw "Planned tag $env:FRAMEWORK_TAG does not match source version $version" }
          git rev-parse HEAD
          git -C tools/Blender rev-parse HEAD

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build paired production protocol
        shell: pwsh
        run: |
          cmd /c build.bat v35
          if ($LASTEXITCODE -ne 0) { throw 'EFF production build failed' }
          python -m pip install --only-binary=:all: Pillow==12.3.0 --target bin/author-core/vendor
          if ($LASTEXITCODE -ne 0) { throw 'Blender Pillow dependency build failed' }
          cmd /c tools\diagnostics\build_author_core.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Blender author core build failed' }
          cmd /c tools\build_resource_pack.cmd v35
          if ($LASTEXITCODE -ne 0) { throw 'Blender resource compiler build failed' }
          cmd /c tools\build_source_index.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Blender source index helper build failed' }

      - name: Build native base and exact pin receipt
        shell: pwsh
        env:
          FRAMEWORK_TAG: ${{ inputs.framework_tag }}
        run: |
          New-Item -ItemType Directory -Force bin/release-artifacts | Out-Null
          python tools/diagnostics/package_blender_native_base.py --output bin/release-artifacts --compiler bin/resource-pack-v35/eff_resource_pack.exe --dll-protocol bin/resource-directory-entry-v35/package-protocol.json --allow-unpinned --framework-tag $env:FRAMEWORK_TAG --manifest-output bin/release-artifacts/native-base.json
          if ($LASTEXITCODE -ne 0) { throw 'Native base build or DLL protocol validation failed' }
          Get-Content bin/release-artifacts/native-base.json -Raw | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY "`nUse this JSON as tools/Blender/native-base.json. Commit the Blender source and EFF gitlink before creating either release tag."

      - name: Upload immutable candidate for the release workflow
        uses: actions/upload-artifact@v4
        with:
          name: eff-blender-native-base-${{ inputs.framework_tag }}
          path: bin/release-artifacts/EFF_Blender_Native_*.zip
          if-no-files-found: error
          retention-days: 30
