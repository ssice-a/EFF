name: Release readiness
description: Track validation and publishing across the independently released EFF tools.
title: "Release: "
labels: ["release-management"]
body:
  - type: input
    id: eff_version
    attributes:
      label: EFF version
      placeholder: v1.11.0
    validations:
      required: true
  - type: input
    id: blender_version
    attributes:
      label: Blender add-on version
      placeholder: v0.50.0
    validations:
      required: true
  - type: input
    id: animestudio_version
    attributes:
      label: AnimeStudio version
      placeholder: v1.8.1
    validations:
      required: true
  - type: input
    id: manager_version
    attributes:
      label: EFF Mod Manager version
      placeholder: v0.1.1
    validations:
      required: false
  - type: textarea
    id: commits
    attributes:
      label: Source commits
      description: Record exact commits and parent-repository gitlinks before creating tags.
      placeholder: |
        EFF:
        EFF-blender:
        AnimeStudio:
        EFF-Mod-Manager:
        EFF gitlinks verified:
    validations:
      required: true
  - type: checkboxes
    id: release_gates
    attributes:
      label: Release gates
      options:
        - label: All intended changes are committed in each repository; no local-only file is part of the release.
          required: false
        - label: EFF gitlinks point to the reviewed Blender and AnimeStudio commits.
          required: false
        - label: EFF shared-tools ZIP, manifest size/SHA256, and compiler-to-DLL protocol were verified.
          required: false
        - label: CI for each exact repository commit passed before its Release was published.
          required: false
        - label: EFF Release contains the DLL, shared-tools ZIP, and eff-native-tools.json.
          required: false
        - label: Blender's package excludes duplicate native tools and targets Blender 5.2.
          required: false
        - label: Final asset names, sizes, and SHA256 values were checked on each changed Release page.
          required: false
  - type: textarea
    id: validation
    attributes:
      label: Validation evidence
      description: Link CI runs, shared-tools validation, Release pages, and any manual acceptance.
      render: markdown
    validations:
      required: false
